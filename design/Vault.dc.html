<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Material Browser · Unlock the vault</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
<link rel="stylesheet" href="./m3.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&amp;family=Roboto+Mono:wght@400;500&amp;family=Noto+Sans+HK:wght@400;500;700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="m3 win {{theme}}">
  <header class="tbar">
    <div class="brand" style="flex: 1"><img class="logo" src="./app-icon.png" alt="" width="36" height="36"><div class="bt"><span class="title-m em">Material Browser</span></div></div>
    <button class="ib sl" aria-label="Accessibility tools"><span class="ms">accessibility_new</span></button>
    <div class="wctl"><button aria-label="Minimize"><span class="ms s20">minimize</span></button><button aria-label="Maximize"><span class="ms s18">crop_square</span></button><button aria-label="Close"><span class="ms s20">close</span></button></div>
  </header>
  <main class="panes" style="padding: 0 16px 16px">
    <section class="pane" aria-labelledby="unlock-h" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px">
      <div style="width: min(520px, 100%); display: flex; flex-direction: column; gap: 24px; --tf-bg: var(--surface)">
        <div class="av xl p shape-cookie" aria-hidden="true" style="width: 96px; height: 96px"><span class="ms s40 fill">lock</span></div>
        <div><h1 id="unlock-h" class="display-s em">Unlock your vault</h1><p class="body-l on-sv">6 profiles and 4 Super Profiles are encrypted on this computer. Enter your passphrase to open them.</p></div>
        <div>
          <label class="tf focus"><span class="lab">Vault passphrase</span><input type="password" value="correct horse" aria-label="Vault passphrase"><button class="ib sl" type="button" aria-label="Show passphrase"><span class="ms">visibility</span></button></label>
          <p class="tf-sup">Caps Lock is off</p>
        </div>
        <button class="btn filled m sl"><span class="ms">lock_open</span>Unlock</button>
        <div class="seglist">
          <button class="li sl"><span class="ms">devices</span><span class="txt"><span>Join a vault from another computer</span><span class="sup">Scan a pairing code from that computer</span></span><span class="ms">chevron_right</span></button>
          <button class="li sl"><span class="ms">confirmation_number</span><span class="txt"><span>Locked out?</span><span class="sup">Support Tickets shows where your data lives</span></span><span class="ms">chevron_right</span></button>
        </div>
      </div>
    </section>
  </main>
  <footer class="sbar"><span class="stat"><span class="ms fill c-primary">verified_user</span>Native host connected</span><span style="flex: 1"></span><span>English · Funny level 5</span><span>0.1.1 · updated 30 Oct 2026, 14:05</span></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'dark' : '' };
  }
}
</script>
</body>
</html>

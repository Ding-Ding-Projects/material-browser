name: Windows build and release

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# Each source push gets its own build. Publishing tags cannot trigger this workflow.
jobs:
  windows-release:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      MATERIAL_BROWSER_BUNDLE_ONLY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.4.0'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.96.1'
      - name: Record toolchain and workflow start
        run: |
          New-Item -ItemType Directory -Force .agent/release | Out-Null
          gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/jobs" --jq '[.jobs[].started_at] | min' > .agent/release/started.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --version
          npm --version
          rustc --version
          cargo --version
          gh --version
      - name: Build unsigned desktop installer through supported entrypoint
        run: |
          & .\build-installer.bat -Component Desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build single-file offline handbook through supported entrypoint
        run: |
          & .\build-installer.bat -Component DocsCompanion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish normal release and read back source and assets
        run: ./scripts/publish-release.ps1
      - name: Collect safe build outputs even after failure
        if: ${{ always() }}
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          New-Item -ItemType Directory -Force .agent/release | Out-Null
          @{ source=$env:GITHUB_SHA; runId=$env:GITHUB_RUN_ID; attempt=$env:GITHUB_RUN_ATTEMPT; status=$env:JOB_STATUS; runner=$env:RUNNER_OS; architecture=$env:RUNNER_ARCH } | ConvertTo-Json | Set-Content .agent/release/run.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: windows-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            apps/desktop/out/make/squirrel.windows/x64/*.exe
            apps/desktop/out/make/squirrel.windows/x64/*.nupkg
            apps/desktop/out/make/squirrel.windows/x64/RELEASES
            apps/docs-companion/release/*.exe
            .agent/release/*.json
            .agent/release/*.txt
